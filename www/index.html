<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08090c">
<title>Daily Ops</title>
<style>
:root{
  --bg:#08090c; --panel:#11141a; --raised:#181c24; --line:#242a35;
  --ink:#eef0f4; --muted:#8a91a0;
  --em:#12f7a4; --blue:#2fd3ff; --amber:#ffb84d; --violet:#b389ff; --mag:#ff5ec4; --red:#ff5b6e;
  --mono:ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.4;color-scheme:dark}
body{background-image:linear-gradient(rgba(47,211,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(47,211,255,.03) 1px,transparent 1px);background-size:34px 34px;min-height:100vh}
#app{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(96px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:var(--ink);background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none;width:100%}
input:focus,textarea:focus,select:focus{border-color:var(--blue)}
input[type=time]{width:auto;min-width:130px;font-family:var(--mono);font-weight:600}
input[type=number]{width:110px;font-family:var(--mono);font-weight:600;text-align:center}
textarea{resize:none}
h1,h2,h3{margin:0}
.hide{display:none!important}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px}
.hello{font-size:22px;font-weight:700}
.date{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:2px;letter-spacing:.04em}
.page-title{font-family:var(--mono);font-size:20px;font-weight:700;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 14px}

/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-bottom:8px}
.big{font-size:20px;font-weight:700;line-height:1.3}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;font-weight:700;background:var(--raised);border:1px solid var(--line)}
.btn:active{transform:scale(.97)}
.primary{background:var(--em);color:#04120c;border-color:var(--em)}
.danger{color:var(--red);border-color:rgba(255,91,110,.4);background:rgba(255,91,110,.08)}
.block{width:100%}
.row{display:flex;gap:10px;align-items:center}
.row.between{justify-content:space-between}
.link{color:var(--blue);font-weight:600;font-size:14px}

/* now card */
.now{border-color:rgba(18,247,164,.35);background:linear-gradient(180deg,rgba(18,247,164,.07),var(--panel))}
.now.sleep{border-color:rgba(179,137,255,.4);background:linear-gradient(180deg,rgba(179,137,255,.08),var(--panel))}
.dots{display:flex;gap:6px;margin:12px 0 14px}
.dots i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--em)}
.dots i.cur{background:var(--amber)}

/* water */
.ring-wrap{position:relative;width:220px;height:220px;margin:4px auto 14px}
.ring{width:220px;height:220px}
.ring-bg{fill:none;stroke:var(--line);stroke-width:14}
.ring-fg{fill:none;stroke:var(--blue);stroke-width:14;stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.ring-fg.full{stroke:var(--em)}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-center .ml{font-family:var(--mono);font-size:44px;font-weight:800;line-height:1}
.ring-center .of{font-family:var(--mono);font-size:13px;color:var(--muted);margin-top:4px}
.ring-center .pct{font-family:var(--mono);font-size:13px;color:var(--blue);margin-top:6px}
.cup-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:14px;padding:16px;border-radius:18px;background:var(--blue);color:#03141a;font-weight:800;border:0;box-shadow:0 0 24px rgba(47,211,255,.25)}
.cup-btn:active{transform:scale(.97)}
.cup-btn .cup{font-size:34px;line-height:1}
.cup-btn b{display:block;font-size:22px;font-family:var(--mono)}
.cup-btn small{display:block;font-size:12px;font-weight:600;opacity:.75}
.cup-btn.pop{animation:pop .35s ease}
@keyframes pop{40%{transform:scale(1.04)}}
.pace{margin:12px 0 4px;text-align:center;font-size:14px;font-weight:600}
.pace.ok{color:var(--em)} .pace.warn{color:var(--amber)}

/* tasks */
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:6px 0 12px}
.prog i{display:block;height:100%;background:var(--em);transition:width .4s}
ul{list-style:none;margin:0;padding:0}
.task{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task span{flex:1;font-size:15px}
.task.done span{color:#5d6471;text-decoration:line-through}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--muted);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#04120c;font-weight:900;font-size:15px}
.task.done .chk{background:var(--em);border-color:var(--em)}
.ico{width:36px;height:36px;color:var(--muted);font-size:16px}
.add{display:flex;gap:8px;margin-top:10px}
.add input{flex:1}
.add button{width:52px;background:var(--raised);border:1px solid var(--line);border-radius:12px;font-size:22px;font-weight:700}
.hd{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.hd h3{font-family:var(--mono);font-size:15px}
.empty{color:var(--muted);font-size:13px;padding:6px 0}

/* settings */
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.set-row:first-of-type{border-top:0}
.set-row .lbl{font-weight:600}
.set-row .lbl small{display:block;color:var(--muted);font-weight:400;font-size:12px;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
.chip{padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--raised);font-family:var(--mono);font-weight:700;font-size:14px}
.chip.on{background:var(--blue);color:#03141a;border-color:var(--blue)}
.sw{position:relative;width:52px;height:30px;flex-shrink:0}
.sw input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:2}
.sw i{position:absolute;inset:0;background:var(--line);border-radius:15px;transition:.2s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+i{background:var(--em)}
.sw input:checked+i::after{transform:translateX(22px);background:#04120c}
.prayer{padding:12px 0;border-top:1px solid var(--line)}
.prayer:first-of-type{border-top:0}
.prayer .r1{display:flex;gap:10px;align-items:center}
.prayer input[type=text]{flex:1;padding:10px 12px}
.note{background:rgba(255,184,77,.08);border:1px solid rgba(255,184,77,.3);color:var(--amber);border-radius:12px;padding:10px 12px;font-size:13px;margin-top:10px}
.ok-note{background:rgba(18,247,164,.07);border:1px solid rgba(18,247,164,.3);color:var(--em)}
.step{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
.step:first-of-type{border-top:0}
.step span{flex:1;font-size:14px}
.step b{font-family:var(--mono);color:var(--amber);width:20px}

/* nav */
#nav{position:fixed;left:0;right:0;bottom:0;background:rgba(10,12,16,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
#nav .in{display:flex;width:100%;max-width:520px}
#nav button{flex:1;padding:10px 0 9px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.04em}
#nav button span{font-size:22px;line-height:1}
#nav button.on{color:var(--em)}

/* sheet */
#sheet{position:fixed;inset:0;z-index:50;display:none}
#sheet.open{display:block}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.65)}
.panel{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.panel h3{font-size:18px;margin-bottom:6px}
.panel .btns{display:flex;gap:10px;margin-top:14px}
.panel .btns .btn{flex:1}
.panel input{margin-top:8px}
.bars{display:flex;align-items:flex-end;gap:8px;height:150px;margin:14px 0 6px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-family:var(--mono);font-size:10px;color:var(--muted)}
.bars i{display:block;width:100%;background:var(--blue);border-radius:6px 6px 0 0;min-height:3px}
.bars i.hit{background:var(--em)}
#alarm{position:fixed;inset:0;z-index:99;background:rgba(8,9,12,.97);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px}
#alarm.open{display:flex}
#alarm .em{font-size:72px;animation:ring 1s infinite}
@keyframes ring{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}
#alarm h2{font-size:26px;margin:18px 0 8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}
.wd{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:12px;background:var(--raised);border:1px solid var(--line);font-size:10px;position:relative}
.wd b{font-family:var(--mono);color:var(--muted)}.wd span{font-size:18px}
.wd.on{border-color:var(--em);background:rgba(18,247,164,.1)}.wd.on b{color:var(--em)}
.wd.today::after{content:"";position:absolute;top:4px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--amber)}
.exr{padding:12px 0;border-top:1px solid var(--line)}.exr:first-child{border-top:0}
.exn{font-weight:700;font-size:16px}
.sets{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.sb{width:42px;height:42px;border-radius:50%;border:2px solid var(--muted);font-family:var(--mono);font-weight:800;color:var(--muted)}
.sb.on{background:var(--em);border-color:var(--em);color:#04120c}.sb:disabled{opacity:.4}
#rest{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));max-width:488px;margin:0 auto;z-index:30;background:var(--amber);color:#1a1100;border-radius:14px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;font-weight:800;font-family:var(--mono)}
.wd small{font-size:9px;color:var(--muted);max-width:100%;overflow:hidden;white-space:nowrap}
.hbar{display:flex;gap:8px;align-items:center;margin:6px 0}
</style>
</head>
<body>
<div id="app">
  <div id="main"></div>
</div>
<nav id="nav"><div class="in">
  <button data-act="go" data-p="home"><span>🏠</span>HOME</button>
  <button data-act="go" data-p="water"><span>💧</span>PANI</button>
  <button data-act="go" data-p="ex"><span>💪</span>EXERCISE</button>
  <button data-act="go" data-p="tasks"><span>✅</span>KAAM</button>
  <button data-act="go" data-p="settings"><span>⚙️</span>SETTINGS</button>
</div></nav>
<div id="sheet"></div>
<div id="rest" class="hide"><span id="restT"></span><button data-act="restStop" style="font-weight:800">Skip ✕</button></div>
<div id="alarm"><div class="em">⏰</div><h2 id="alarmTitle"></h2><p id="alarmBody" class="muted"></p><button class="btn primary" style="margin-top:22px;min-width:200px" data-act="alarmOff">Theek hai ✓</button></div>

<script>
(function(){
'use strict';

/* ---------------- basics ---------------- */
const NATIVE = !!(window.Capacitor && typeof window.Capacitor.isNativePlatform === 'function' && window.Capacitor.isNativePlatform());
const LN = (NATIVE && window.Capacitor.Plugins) ? window.Capacitor.Plugins.LocalNotifications : null;
const KEY = 'dailyOps_v3';
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'i' + Math.random().toString(36).slice(2);
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const toMin = t => { const p = String(t || '0:0').split(':').map(Number); return (p[0] || 0) * 60 + (p[1] || 0); };
const fmtMin = m => { m = ((m % 1440) + 1440) % 1440; const h = Math.floor(m / 60), mm = m % 60; return ((h % 12) || 12) + ':' + String(mm).padStart(2, '0') + ' ' + (h < 12 ? 'AM' : 'PM'); };
const fmtT = t => fmtMin(toMin(t));
const fmtDate = d => fmtMin(d.getHours() * 60 + d.getMinutes());
function fmtDur(ms){
  const m = Math.max(1, Math.round(ms / 60000));
  if (m < 60) return m + ' min';
  const h = Math.floor(m / 60), r = m % 60;
  return h + ' ghante' + (r ? ' ' + r + ' min' : '');
}

/* ---------------- state ---------------- */
function defaults(){
  return {
    v: 3, day: null,
    settings: {
      cup: 200, target: 2500, waterOn: true, waterEvery: 60, snd: {}, weight: 0,
      wake: '04:30', wakeOn: true, sleep: '21:30', sleepOn: true,
      prayers: [
        { id: uid(), name: 'Fajr', time: '05:10', on: true },
        { id: uid(), name: 'Zuhr + Asr', time: '12:15', on: true },
        { id: uid(), name: 'Maghrib + Isha', time: '18:00', on: true }
      ],
      routine: ['Wudu karke Fajr ki namaz parho', 'Exercise karo (run + planks)', 'Pani piyo — 1 se 2 glass']
    },
    water: {},
    tasks: [
      { id: uid(), text: 'Namaz waqt par parhna', pri: 'imp', done: false, rep: true, rem: null },
      { id: uid(), text: 'Hotel Owner Meetup (Keychain Stand Pitch)', pri: 'imp', done: false, rep: false, rem: null },
      { id: uid(), text: 'Roti laana', pri: 'norm', done: false, rep: false, rem: null },
      { id: uid(), text: 'Nakhun kaatna', pri: 'norm', done: false, rep: false, rem: null }
    ],
    habits: [
      { id: uid(), text: 'Gussa Control (5 seconds khamoshi)', checked: false, rem: null, log: {} },
      { id: uid(), text: 'Morning Routine (Run + Planks)', checked: false, rem: null, log: {} }
    ],
    win: '', leak: '', audits: [],
    routine: { day: null, idx: 0, done: false, planAsked: false },
    ex: { plan: null, log: {}, on: true, time: '16:30' }
  };
}
function load(){
  const base = defaults();
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const p = JSON.parse(raw);
      const s = Object.assign(base, p);
      s.settings = Object.assign(defaults().settings, p.settings || {});
      s.routine = Object.assign(defaults().routine, p.routine || {});
      s.ex = Object.assign(defaults().ex, p.ex || {});
      if (!p.tasks) { const cv = (a, pri, rp) => (a || []).map(t => ({ id: t.id || uid(), text: t.text, pri: pri, done: !!t.checked, rep: rp, rem: null })); s.tasks = [].concat(cv(p.nonNeg, 'imp', true), cv(p.core, 'imp', false), cv(p.quick, 'norm', false)); }
      s.habits = (s.habits || []).map(x => ({ id: x.id || uid(), text: x.text, checked: !!x.checked, rem: (x.rem && x.rem.time) ? x.rem : null, log: x.log || {} }));
      return s;
    }
    const old = localStorage.getItem('dailyOpsState_v2');
    if (old) {
      const o = JSON.parse(old);
      const conv = a => (a || []).map(t => ({ id: t.id || uid(), text: t.text, checked: !!(t.checked || t.status === 'done') }));
      if (o.nonNeg) base.nonNeg = conv(o.nonNeg);
      if (o.core) base.core = conv(o.core);
      if (o.quick) base.quick = conv(o.quick);
      if (o.habits) base.habits = conv(o.habits);
      base.audits = (o.auditHistory || []).slice(0, 30);
    }
  } catch (e) {}
  return base;
}
let state = load();
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

function dayKey(d){
  d = d || new Date();
  const W = toMin(state.settings.wake);
  const x = new Date(d.getTime() - W * 60000);
  return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0');
}
function rollover(){
  const k = dayKey();
  if (state.day && k <= state.day) return false;
  state.habits.forEach(t => t.checked = false);
  state.tasks.forEach(t => { if (t.rep) t.done = false; });
  state.tasks = state.tasks.filter(t => t.rep || !t.done);
  state.routine = { day: k, idx: 0, done: false, planAsked: false };
  state.day = k;
  const keys = Object.keys(state.water).sort();
  while (keys.length > 120) delete state.water[keys.shift()];
  save();
  return true;
}
rollover();
if (!state.day) { state.day = dayKey(); save(); }

/* ---------------- water ---------------- */
function wd(){ if (!state.water[state.day]) state.water[state.day] = { ml: 0, log: [] }; return state.water[state.day]; }
function awakeInfo(now){
  now = now || new Date();
  const S = state.settings, W = toMin(S.wake), Sl = toMin(S.sleep);
  const m = now.getHours() * 60 + now.getMinutes();
  const dur = (((Sl - W) + 1440) % 1440) || 1440;
  const el = (m - W + 1440) % 1440;
  return { awake: el < dur, el, dur, W, Sl, m };
}
function expectedMl(){
  const i = awakeInfo();
  return i.awake ? Math.round(state.settings.target * i.el / i.dur) : state.settings.target;
}

/* ---------------- schedule (shared by native + browser) ---------------- */
const WATER_MSG = [
  'Ek cup ({ml} ml) pani piyo 💧',
  'Pani peene ka waqt ho gaya — {ml} ml 🥛',
  'Sehat ke liye pani! Abhi ek cup piyo 💦',
  'Dimaag aur jism ko pani chahiye — {ml} ml piyo'
];
function buildPlan(now){
  const S = state.settings, out = [];
  const y = now.getFullYear(), mo = now.getMonth(), da = now.getDate();
  const mk = (d, min) => new Date(y, mo, da + d, 0, min, 0, 0);
  const W = toMin(S.wake), Sl = toMin(S.sleep);
  for (let d = 0; d < 14; d++) {
    if (S.wakeOn) out.push({ kind: 'wake', at: mk(d, W), title: '☀️ Uth jao!', body: 'Subah ho gayi — pani piyo, namaz parho, routine shuru karo.', ch: 'alarm', name: 'Jagne ka alarm' });
    if (S.sleepOn) out.push({ kind: 'sleep', at: mk(d, Sl - 30), title: '🌙 Sone ka waqt qareeb', body: '30 min mein sona hai. Phone side pe rakho aur aaram karo.', ch: 'task', name: 'Sone ki yaad' });
    S.prayers.forEach(p => {
      if (p.on) out.push({ kind: 'prayer', at: mk(d, toMin(p.time)), title: '🕌 ' + p.name + ' ka waqt ho gaya', body: 'Wudu karo aur namaz parho.', ch: 'prayer', name: p.name });
    });
  }
  state.tasks.forEach(t => {
    if (t.done || !t.rem || !t.rem.time) return;
    const tm = toMin(t.rem.time), ttl = (t.pri === 'imp' ? '❗ Zaroori kaam: ' : '⏰ Yaad dahani: ') + t.text;
    if (t.rem.date) { const q = t.rem.date.split('-').map(Number); out.push({ kind: 'task', at: new Date(q[0], q[1] - 1, q[2], 0, tm), title: ttl, body: 'Yeh kaam abhi baqi hai.', ch: 'task', name: t.text }); return; }
    for (let d = 0; d < (t.rep ? 14 : 3); d++) { const at = mk(d, tm); if (!t.rep && at <= now) continue; out.push({ kind: 'task', at: at, title: ttl, body: 'Yeh kaam abhi baqi hai.', ch: 'task', name: t.text }); if (!t.rep) break; }
  });
  state.habits.forEach(x => {
    if (!x.rem || !x.rem.time) return;
    for (let d = 0; d < 14; d++) { if (d === 0 && x.checked) continue; out.push({ kind: 'habit', at: mk(d, toMin(x.rem.time)), title: '🧠 Aadat: ' + x.text, body: 'Aaj ki aadat poori karo.', ch: 'task', name: x.text }); }
  });
  const X = state.ex;
  if (X.on) for (let d = 0; d < 14; d++) {
    const pl = exPlan()[mk(d, 0).getDay()];
    if (pl && !pl.rest) out.push({ kind: 'exercise', at: mk(d, toMin(X.time)), title: '💪 Exercise ka waqt!', body: pl.title + ' — ' + pl.exs.length + ' exercise. Chalo shuru karo!', ch: 'ex', name: 'Exercise' });
  }
  if (S.waterOn) {
    const every = S.waterEvery, dur = (((Sl - W) + 1440) % 1440) || 1440;
    const w = state.water[state.day], lastT = (w && w.log.length) ? w.log[w.log.length - 1].t : 0;
    let n = 0;
    for (let d = -1; d < 7 && n < 200; d++) {
      for (let k = every; k < dur && n < 200; k += every) {
        const at = mk(d, W + k);
        if (at <= now) continue;
        if (w && w.ml >= S.target && dayKey(at) === state.day) continue;
        if (lastT && at.getTime() - lastT < every * 30000) continue;
        out.push({ kind: 'water', at: at, title: '💧 Pani ka waqt!', body: WATER_MSG[n % WATER_MSG.length].split('{ml}').join(S.cup), ch: 'water', name: 'Pani' });
        n++;
      }
    }
  }
  return out.filter(x => x.at > now).sort((a, b) => a.at - b.at);
}

async function ensurePerms(ask){

}

  closeSheet: () => closeSheet(),
  alarmOff: () => alarmOff(),
  drink: () => {
    const w = wd(); w.ml += state.settings.cup; w.log.push({ t: Date.now(), ml: state.settings.cup });
    try { if (navigator.vibrate) navigator.vibrate(35); } catch (e) {}
    save(); render(); sched();
    const b = $('#cupBtn'); if (b) b.classList.add('pop');
  },
  undo: () => { const w = wd(); const l = w.log.pop(); if (l) { w.ml = Math.max(0, w.ml - l.ml); save(); render(); sched(); } },
  history: () => openHistory(),
  stepDone: () => {
    const R = state.routine; R.idx++;
    if (R.idx >= state.settings.routine.length) { R.done = true; save(); render(); openPlan(); }
    else { save(); render(); }
  },
  skipRoutine: () => { state.routine.done = true; save(); render(); },
  plan: () => openPlan(),
  toggle: el => { const t = findItem(el.dataset.list, el.dataset.id); if (t) { t.checked = !t.checked; save(); render(); } },
  edit: async el => { const t = findItem(el.dataset.list, el.dataset.id); if (!t) return; const v = await askText('Badlo', t.text); if (v) { t.text = v; save(); render(); } },
  del: async el => { if (await askConfirm('Yeh hata dun?')) { state[el.dataset.list] = state[el.dataset.list].filter(t => t.id !== el.dataset.id); save(); render(); } },
  saveAudit: () => {
    const win = state.win.trim(), leak = state.leak.trim();
    if (!win && !leak) return;
    state.audits.unshift({ date: new Date().toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }), win, leak });
    state.audits = state.audits.slice(0, 30); state.win = ''; state.leak = ''; save(); render();
  },
  delAudit: el => { state.audits.splice(+el.dataset.i, 1); save(); render(); },
  cup: el => { state.settings.cup = +el.dataset.v; save(); render(); sched(); },
  addPrayer: async () => { const n = await askText('Alarm ka naam', '', 'jaise: Namaz-e-Shab'); if (n) { state.settings.prayers.push({ id: uid(), name: n, time: '12:00', on: true }); save(); render(); sched(); } },
  delPrayer: async el => { if (await askConfirm('Yeh alarm hata dun?')) { state.settings.prayers = state.settings.prayers.filter(p => p.id !== el.dataset.id); save(); render(); sched(); } },
  addStep: async () => { const v = await askText('Naya step', '', 'jaise: Naha kar tayyar ho'); if (v) { state.settings.routine.push(v); save(); render(); } },
  editStep: async el => { const i = +el.dataset.i; const v = await askText('Step badlo', state.settings.routine[i]); if (v) { state.settings.routine[i] = v; save(); render(); } },
  delStep: async el => { if (await askConfirm('Yeh step hata dun?')) { state.settings.routine.splice(+el.dataset.i, 1); state.routine.idx = 0; save(); render(); } },
  wAdd: async () => { const n = Math.round(+(await askText('Kitna pani piya (ml)?', '', 'jaise 350'))); if (n > 0 && n <= 3000) { const w = wd(); w.ml += n; w.log.push({ t: Date.now(), ml: n }); save(); render(); sched(); } },
  wTarget: () => { state.settings.target = clamp(Math.round(state.settings.weight * 35 / 50) * 50, 500, 10000); save(); render(); sched(); },
  hAdd: () => taskForm({ id: uid(), text: '', checked: false, rem: null, log: {} }, 'habit', o => { state.habits.push(o); save(); render(); sched(); }),
  tAddImp: () => taskForm({ id: uid(), text: '', pri: 'imp', done: false, rep: false, rem: null }, 'task', o => { state.tasks.push(o); save(); render(); sched(); }),
  tAddNorm: () => taskForm({ id: uid(), text: '', pri: 'norm', done: false, rep: false, rem: null }, 'task', o => { state.tasks.push(o); save(); render(); sched(); }),
  tTog: el => { const t = state.tasks.find(x => x.id === el.dataset.id); if (t) { t.done = !t.done; save(); render(); sched(); } },
  hTog: el => { const x = state.habits.find(y => y.id === el.dataset.id); if (x) { x.checked = !x.checked; if (x.checked) x.log[state.day] = 1; else delete x.log[state.day]; save(); render(); sched(); } },
  tEdit: el => { const t = state.tasks.find(x => x.id === el.dataset.id); if (t) taskForm(t, 'task', () => { save(); render(); sched(); }); },
  hEdit: el => { const x = state.habits.find(y => y.id === el.dataset.id); if (x) taskForm(x, 'habit', () => { save(); render(); sched(); }); },
  tDel: async el => { if (await askConfirm('Yeh kaam hata dun?')) { state.tasks = state.tasks.filter(x => x.id !== el.dataset.id); save(); render(); sched(); } },
  hDel: async el => { if (await askConfirm('Yeh aadat hata dun?')) { state.habits = state.habits.filter(x => x.id !== el.dataset.id); save(); render(); sched(); } },
  sndPick: el => sndMode(el.dataset.k, 'custom'),
  sndTest: async el => {
    const k = el.dataset.k; if (!NATIVE) { beepOnce(); return; }
    try { await ensureChannels(); await ensurePerms(true); await LN.schedule({ notifications: [{ id: 999000 + Object.keys(SND).indexOf(k), title: 'Test: ' + SND[k].n, body: 'Awaaz check', schedule: { at: new Date(Date.now() + 4000), allowWhileIdle: true }, channelId: chId(k), smallIcon: 'ic_stat_icon', iconColor: '#12F7A4' }] }); } catch (e) {}
  },
  restStop: () => stopRest(),
  exDay: el => { exSel = +el.dataset.i; render(); },
  exSet: el => {
    const pl = exPlan()[todayIdx()], x = pl.exs.find(e => e.id === el.dataset.id); if (!x) return;
    const L = exLog(), k = +el.dataset.k, was = L.sets[x.id] || 0;
    L.sets[x.id] = (k === was) ? k - 1 : k;
    const pr = exProg(pl); L.done = pr[1] > 0 && pr[0] >= pr[1];
    save(); if (L.sets[x.id] > was && x.rest && !L.done) startRest(x.rest); if (L.done) stopRest(); render();
  },
  exAdd: () => exForm({ n: '', s: 3, r: '12', rest: 60, tip: '' }, x => { x.id = uid(); exPlan()[exSel].exs.push(x); save(); render(); }),
  exEdit: el => { const x = exPlan()[exSel].exs.find(e => e.id === el.dataset.id); if (x) exForm(x, () => { save(); render(); }); },
  exDel: async el => { if (await askConfirm('Yeh exercise hata dun?')) { const p = exPlan()[exSel]; p.exs = p.exs.filter(e => e.id !== el.dataset.id); save(); render(); } },
  exCfg: () => {
    const p = exPlan()[exSel];
    openSheet('<h3>Din ka naam / target</h3><input id="cT" value="' + esc(p.title) + '"><input id="cG" value="' + esc(p.goal) + '"><label class="row" style="margin-top:12px"><input id="cR" type="checkbox" style="width:22px;height:22px;padding:0" ' + (p.rest ? 'checked' : '') + '> Aaram ka din (reminder nahi aayega)</label><div class="btns"><button class="btn" data-act="closeSheet">Cancel</button><button class="btn primary" id="cOk">Save</button></div>');
    $('#cOk').onclick = () => { p.title = $('#cT').value.trim() || p.title; p.goal = $('#cG').value.trim() || p.goal; p.rest = $('#cR').checked; save(); closeSheet(); render(); sched(); };
  },
  exReset: async () => { if (await askConfirm('Exercise plan default par le jaun?')) { state.ex.plan = defPlan(); save(); render(); sched(); } },
  perms: async () => {
    if (NATIVE) { await ensurePerms('force'); sched(); render(); }
    else if ('Notification' in window) { try { await Notification.requestPermission(); } catch (e) {} showAlarm('🔔 Test', 'Notification permission check', false); }
  },
  test: async () => {
    if (!NATIVE) { setTimeout(() => showAlarm('🕌 Test alarm', 'Yeh alarm ka test hai. Sab theek hai!', true), 5000); return; }
    try {
      await ensureChannels(); await ensurePerms(true);
      await LN.schedule({ notifications: [{ id: 999999, title: '⏰ Test alarm', body: 'Yeh alarm ka test hai. Sab theek hai!', schedule: { at: new Date(Date.now() + 5000), allowWhileIdle: true }, channelId: chId('alarm'), smallIcon: 'ic_stat_icon', iconColor: '#12F7A4' }] });
      openSheet('<h3>⏰ 5 second mein test alarm aayega</h3><p class="sub">App band kar ke ya screen lock kar ke bhi check kar sakte ho.</p><div class="btns"><button class="btn primary" data-act="closeSheet">Theek hai</button></div>');
    } catch (e) { openSheet('<h3>Test fail hua</h3><p class="sub">' + esc(String((e && e.message) || e)) + '</p><div class="btns"><button class="btn" data-act="closeSheet">Band karo</button></div>'); }
  },
  resetAll: async () => {
    if (await askConfirm('Sab data (kaam, pani, settings) mehfooz hata dun?')) {
      try { localStorage.removeItem(KEY); } catch (e) {}
      state = defaults(); state.day = dayKey(); state.routine.day = state.day; save(); render(); sched();
    }
  }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const f = acts[el.dataset.act];
  if (f) f(el);
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form.add');
  if (!f) return;
  e.preventDefault();
  const inp = f.querySelector('input'), v = inp.value.trim();
  if (!v) return;
  state[f.dataset.list].push({ id: uid(), text: v, checked: false });
  save(); render();
  const again = document.querySelector('form.add[data-list="' + f.dataset.list + '"] input');
  if (again) again.focus();
});
document.addEventListener('input', e => {
  const a = e.target.dataset && e.target.dataset.audit;
  if (a) { state[a] = e.target.value; save(); }
});
document.addEventListener('change', e => {
  const el = e.target, k = el.dataset && el.dataset.set;
  if (!k) return;
  const S = state.settings;
  if (k.indexOf('snd.') === 0) { sndMode(k.slice(4), el.value); return; }
  switch (k) {
    case 'weight': S.weight = clamp(Math.round(+el.value) || 0, 0, 300); break;
    case 'cup': S.cup = clamp(Math.round(+el.value) || 200, 10, 2000); break;
    case 'target': S.target = clamp(Math.round(+el.value) || 2500, 500, 10000); break;
    case 'waterOn': S.waterOn = el.checked; break;
    case 'waterEvery': S.waterEvery = +el.value; break;
    case 'wake': if (el.value) S.wake = el.value; break;
    case 'sleep': if (el.value) S.sleep = el.value; break;
    case 'wakeOn': S.wakeOn = el.checked; break;
    case 'sleepOn': S.sleepOn = el.checked; break;
    case 'exOn': state.ex.on = el.checked; break;
    case 'exTime': if (el.value) state.ex.time = el.value; break;
    case 'p.name': case 'p.time': case 'p.on': {
      const p = S.prayers.find(x => x.id === el.dataset.id);
      if (p) { if (k === 'p.name') p.name = el.value.trim() || p.name; if (k === 'p.time' && el.value) p.time = el.value; if (k === 'p.on') p.on = el.checked; }
      break;
    }
  }
  save(); render(); sched();
});

/* ---------------- lifecycle ---------------- */
function tick(){
  const changed = rollover();
  if (!NATIVE) webTick();
  if (page === 'home' && !isSheetOpen() && !$('#alarm').classList.contains('open')) render();
  if (changed) sched();
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) { rollover(); render(); sched(); } });

async function init(){
  render();
  if (NATIVE && LN) {
    try { await ensureChannels(); await ensurePerms(true); } catch (e) {}
    try { LN.addListener('localNotificationActionPerformed', () => { rollover(); go('home'); }); } catch (e) {}
  } else if (!NATIVE && 'Notification' in window && Notification.permission === 'default') {
    try { Notification.requestPermission(); } catch (e) {}
  }
  sched();
  setInterval(tick, NATIVE ? 30000 : 5000);
  if (NATIVE) render();
}
window.__dailyOps = { buildPlan: buildPlan, getState: () => state };
init();
})();
</script>
</body>
</html>
